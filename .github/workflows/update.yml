name: Update Android Studio releases

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-android-studio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Test release updater
        run: python3 -m unittest discover -v

      - name: Discover current releases
        run: python3 scripts/update_android_studio.py

      - name: Validate changes
        id: changes
        run: |
          set -euo pipefail
          git diff --check

          mapfile -t specs < <(git diff --name-only --diff-filter=AM -- 'packages/*.spec' 'packages/*/*.spec')
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          packages=()
          for spec in "${specs[@]}"; do
            package=${spec#packages/}
            package=${package%%/*}
            packages+=("$package")
            rpmspec -P "$spec" >/dev/null
          done

          packages_json=$(jq -cn --args "${packages[@]}" '$ARGS.positional | unique')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "packages=$packages_json" >> "$GITHUB_OUTPUT"

      - name: Commit updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/*/*.spec
          git commit -m "chore: update Android Studio releases"
          git push

      - name: Request COPR builds
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.changes.outputs.packages }}
        run: |
          set -euo pipefail
          for package in $(jq -r '.[]' <<< "$PACKAGES"); do
            gh workflow run build.yml --ref main -f package="$package"
          done
