name: Validate packaging

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RPM validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils rpm

      - name: Test release updaters and build selection
        run: python3 -m unittest discover -v

      - name: Parse RPM specs
        run: |
          set -euo pipefail
          for spec in packages/*/*.spec; do
            rpmspec -P "$spec" >/dev/null
          done
          rpmspec --target aarch64 -P packages/intellij-idea/intellij-idea.spec >/dev/null
          rpmspec --target aarch64 -P packages/eclipse-installer/eclipse-installer.spec >/dev/null

      - name: Validate desktop files
        run: desktop-file-validate packages/*/*.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packages/*/*.metainfo.xml
